spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # spring-boot-docker-compose auto-detects docker-compose.yml and, if its
  # services are already running, silently overrides the datasource above
  # with the local container's connection details — regardless of active
  # profile. Confirmed the hard way running this profile against real RDS
  # on a machine with local Postgres already up: it connected to
  # 127.0.0.1:5432 instead, and Flyway then failed validating against
  # migration-local's locally-only V6. Docker Compose integration is a
  # local-profile-only convenience (see application-local.yml) and must
  # never engage here.
  docker:
    compose:
      enabled: false

aws:
  s3:
    # Account-regional-namespace name (see docs/aws/A4-s3-document-bucket-checklist.md) —
    # the plain "shvoy-documents-dev" name was already taken globally.
    documents-bucket: shvoy-documents-dev-038774852612-eu-west-2-an

cognito:
  user-pool-id: ${COGNITO_USER_POOL_ID}
  app-client-id: ${COGNITO_APP_CLIENT_ID}

# The verified SES sender identity (Story 9.4). A verified address on the verified
# from-domain; SES uses the ECS task role's scoped ses:SendEmail — no SMTP creds.
email:
  sender: ${EMAIL_SENDER}

# No default: deliberately left unresolved (fails startup rather than silently
# allowing nothing, or nothing safe) until it's set. Cloudflare Pages is now
# connected (verified against the dev ECS task definition, 2026-08-20): the
# task sets this to the localhost dev/preview ports plus
# https://shvoy.pages.dev and the per-PR preview wildcard
# https://*.shvoy.pages.dev — the wildcard being exactly why CorsConfig uses
# allowedOriginPatterns.
shvoy:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # No default, same fail-startup reasoning as the CORS origins above: email
  # links point humans at this host, and a wrong or missing value sends them
  # nowhere. The right dev value is known now that Pages is connected —
  # https://shvoy.pages.dev — but it is NOT yet set on the dev ECS task
  # definition (nor is EMAIL_SENDER, and no SES identity is verified yet —
  # A9's console half is unexecuted), so the first deploy of a build
  # containing FrontendLinks/SesEmailSender will fail startup until both env
  # vars are added. That failure is this comment's point: loud, at deploy,
  # not a silent wrong link in someone's inbox.
  frontend:
    base-url: ${FRONTEND_BASE_URL}

logging:
  level:
    com.shvoy: DEBUG
