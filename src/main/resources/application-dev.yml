spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

aws:
  s3:
    documents-bucket: shvoy-documents-dev

cognito:
  user-pool-id: ${COGNITO_USER_POOL_ID}
  app-client-id: ${COGNITO_APP_CLIENT_ID}

# No default: Cloudflare Pages isn't connected yet, so the real value isn't
# known. Deliberately left unresolved (fails startup rather than silently
# allowing nothing, or nothing safe) until it's set. Preview deploys use
# per-PR subdomains, so this will likely need a wildcard pattern, e.g.
# https://*.<project>.pages.dev — CorsConfig uses allowedOriginPatterns
# specifically so that's expressible once the exact domain is known.
shvoy:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.shvoy: DEBUG
