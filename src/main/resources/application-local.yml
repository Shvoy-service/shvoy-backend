spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shvoy
    username: shvoy
    password: shvoy
  jpa:
    show-sql: true
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
  flyway:
    # Adds a local-only seed (a default company row) on top of the shared
    # migrations, so a fresh local dev DB has something to point
    # tenancy.local.default-company-id at. Never applied to dev/prod.
    locations: classpath:db/migration,classpath:db/migration-local

# Stand-in tenant used when a request has no X-Debug-Company-Id header (see
# TenantContextFilter). Local development only — dev/prod have no default
# and require the header until real Cognito-derived tenant resolution
# replaces this mechanism.
tenancy:
  local:
    default-company-id: 00000000-0000-0000-0000-000000000001

aws:
  s3:
    documents-bucket: shvoy-documents-local
    endpoint-override: http://localhost:4566

# Vite's default dev-server port (5173) and preview-server port (4173, used
# by Playwright) — confirmed with the frontend. The dev server itself talks
# to this API through a Vite proxy (same-origin from the browser's view), so
# CORS never fires for that path; the preview server does not proxy, so it's
# the one that actually exercises this config locally.
shvoy:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173

logging:
  level:
    com.shvoy: DEBUG
