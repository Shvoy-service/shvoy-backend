spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

aws:
  s3:
    documents-bucket: shvoy-documents-prod

cognito:
  user-pool-id: ${COGNITO_USER_POOL_ID}
  app-client-id: ${COGNITO_APP_CLIENT_ID}

# No default: the production domain isn't decided yet. Deliberately left
# unresolved until it's set — see application-dev.yml's CORS comment.
shvoy:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Spec/UI stay enabled (springdoc's default) in local/dev — only prod turns
# them off, since there's no reason to expose API surface details publicly
# once this is internet-facing. See SecurityConfig's API_DOCS_ENDPOINTS.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.shvoy: INFO
