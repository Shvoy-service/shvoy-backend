spring:
  application:
    name: shvoy
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

aws:
  region: ${AWS_REGION:eu-west-2}
  s3:
    documents-bucket: ${S3_DOCUMENTS_BUCKET:shvoy-documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
